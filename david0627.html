<style>

#card{padding:10px;position:relative}
#wrap{position:relative;width:var(--bs);min-width:280px;aspect-ratio:1}

.tile{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .3s cubic-bezier(.3,1.45,.6,1)}
.in{position:absolute;inset:5%;border-radius:24%;display:grid;place-items:center;font-size:calc(max(var(--bs),280px)/8*.56);line-height:1;
 background:linear-gradient(145deg,hsl(var(--h) 100% 95%),hsl(var(--h) 90% 80%));
 box-shadow:0 3px 7px rgba(120,60,140,.3),inset 0 -4px 6px rgba(120,60,140,.12),inset 0 3px 4px #fff;animation:appear .35s both;transition:box-shadow .2s}

.hwrap{position:relative;z-index:1;margin:auto;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 6px 18px}
.hheart{font-size:44px;filter:drop-shadow(0 6px 8px rgba(214,61,132,.35))}
.htitle{font-size:clamp(38px,11.5vw,60px);letter-spacing:2px;line-height:1.02;color:transparent;-webkit-text-stroke:0;
 background:linear-gradient(180deg,#ffd0b8 0%,#ff7aa8 50%,#e0457f 100%);-webkit-background-clip:text;background-clip:text;text-shadow:none;
 filter:drop-shadow(0 3px 0 rgba(255,255,255,.7)) drop-shadow(0 8px 10px rgba(214,61,132,.4))}
.hsub{font-weight:800;letter-spacing:3px;font-size:clamp(12px,3.6vw,16px);color:#6b5aa8;margin-bottom:14px}
.menu{display:flex;flex-direction:column;gap:14px;width:100%}
.mi{display:flex;align-items:center;gap:12px;height:58px;padding:0 24px;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:20px;color:#3d2a6b;text-align:left;border-radius:30px;
 background:linear-gradient(180deg,#fff,#f0ebff);box-shadow:0 10px 22px rgba(150,120,210,.28),inset 0 3px 6px #fff,inset 0 -6px 12px rgba(170,140,230,.22);transition:transform .12s}
.mi:active{transform:scale(.97)}
.mi .ic{font-size:24px;filter:drop-shadow(0 2px 2px rgba(80,40,120,.3))}
.mi .tx{flex:1}
.mi .ar{font-size:18px;color:#9a8cc4;font-weight:800}
#mBest{color:#e0457f;font-size:20px}
.mi.hot{color:#5a2410;background:linear-gradient(180deg,#ffc8ae,#ff9c7c);box-shadow:0 12px 24px rgba(255,140,100,.42),inset 0 3px 6px rgba(255,255,255,.7),inset 0 -6px 12px rgba(200,80,50,.25)}
.mi.hot .ar{color:#8a4a30}
.round{position:absolute;z-index:2;top:14px;right:14px;width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;font-size:22px;background:linear-gradient(145deg,#fff,#ece6ff);box-shadow:0 6px 14px rgba(150,120,210,.35),inset 0 2px 4px #fff,inset 0 -3px 6px rgba(170,140,230,.25)}
.foot{margin:10px 0 0;text-align:center;font-weight:700;font-size:12px;letter-spacing:2px;color:#a79bd0;line-height:1.5}
/* ===== POWER PREVIEW + FUSION ===== */
.tile.charging{z-index:4}
.tile.charging .in{animation:charge .3s infinite alternate;box-shadow:0 0 0 4px #fff,0 0 26px 12px #ffd54a}
@keyframes charge{to{transform:scale(1.3) rotate(-6deg);filter:brightness(1.25)}}
.tile.target .in{animation:tgt .45s infinite alternate;box-shadow:0 0 0 3px #fff,0 0 16px 6px #ff3d81}
@keyframes tgt{to{transform:scale(.86);filter:brightness(1.15)}}
[data-sp=n] .in,[data-sp=k] .in,[data-sp=u] .in{animation:glow .6s infinite alternate}
[data-sp=n] .in::after,[data-sp=k] .in::after,[data-sp=u] .in::after{content:"✨"}
#pwBanner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:70;display:none;align-items:center;gap:12px;width:max-content;max-width:94vw;padding:10px 22px 15px;border-radius:30px;background:#fff0f8;color:var(--ink);overflow:hidden;pointer-events:none;box-shadow:6px 8px 18px rgba(190,110,160,.45),inset 3px 3px 7px #fff,inset -4px -5px 10px rgba(225,150,200,.35)}
#pwBanner.go{display:flex;animation:bnrIn .3s cubic-bezier(.3,1.5,.6,1)}
#pwBanner .e{font-size:36px;line-height:1}
#pwBanner b{display:block;font-size:20px;color:var(--pink)}
#pwBanner small{display:block;font-weight:700;font-size:13px}
#pwBanner i{position:absolute;left:0;bottom:0;height:6px;background:linear-gradient(90deg,#ff8cc0,#ffd54a);animation:bnrBar 2s linear forwards}
@keyframes bnrIn{from{transform:translateX(-50%) scale(.5);opacity:0}}
@keyframes bnrBar{from{width:100%}to{width:0}}
#hTarget{font-size:clamp(13px,4vw,17px);white-space:nowrap}
[data-sp=x] .in{animation:glow .6s infinite alternate}
[data-sp=x] .in::after{content:"✨"}
[data-sp=y] .in{background:radial-gradient(circle at 30% 25%,#fffbe0,#ffd54a 60%,#ff8c42);animation:ultra .45s infinite alternate}
[data-sp=y] .in::after{content:"👑"}
@keyframes ultra{from{box-shadow:0 0 10px 3px #ffd54a,inset 0 3px 4px #fff;transform:scale(1)}to{box-shadow:0 0 28px 10px #ff3d81,0 0 44px 16px #7cc4ff,inset 0 3px 4px #fff;transform:scale(1.1)}}
.tile.k-boom .in{animation:kBoom .65s ease-out forwards}
@keyframes kBoom{15%{transform:scale(1.6);filter:brightness(2.2) saturate(2)}100%{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(0);opacity:0}}
.tile.k-zap .in{animation:kZap .6s linear forwards}
@keyframes kZap{0%,40%,80%{filter:brightness(4);transform:translateX(-4px)}20%,60%{filter:brightness(1);transform:translateX(4px)}100%{opacity:0;transform:scale(.2);filter:brightness(5)}}
.tile.k-spin .in{animation:kSpin .9s ease-in forwards}
@keyframes kSpin{to{transform:translate(var(--dx),var(--dy)) rotate(900deg) scale(0);opacity:0}}
.tile.k-meteor .in{background:radial-gradient(circle,#ffe58a,#ff7a3d);box-shadow:0 0 18px 8px #ff6a00;animation:kMet .8s ease-in forwards}
@keyframes kMet{to{transform:translate(40%,320%) rotate(160deg) scale(.4);opacity:0}}
.tile.k-mag .in{animation:kMag .7s cubic-bezier(.6,0,1,.6) forwards}
@keyframes kMag{to{transform:translate(var(--dx),var(--dy)) scale(.1) rotate(360deg);opacity:0}}
.tile.k-gem .in{animation:kGem .7s forwards}
@keyframes kGem{30%{transform:scale(1.3) rotate(15deg);filter:brightness(1.8);box-shadow:0 0 24px 10px #fff,0 0 30px 14px #8be9ff}100%{transform:scale(0) rotate(180deg);opacity:0}}
.tile.k-ice .in{animation:kIce .55s forwards}
@keyframes kIce{30%{transform:scale(1.1) skewX(10deg)}100%{transform:scale(1.7) rotate(30deg);opacity:0;filter:blur(3px) brightness(2)}}
.tile.k-burn .in{animation:kBurn .7s forwards}
@keyframes kBurn{40%{filter:grayscale(1) brightness(.4)}100%{transform:translateY(-110%) scale(.3);opacity:0;filter:grayscale(1) brightness(.3)}}

/* ===== dreamy aurora background ===== */
#bg{background:linear-gradient(160deg,#ffd9ee 0%,#e6d6ff 45%,#d2ebff 100%)}
#bg::before{content:"";position:absolute;inset:-25%;background:
 radial-gradient(40% 35% at 20% 25%,rgba(255,140,200,.75),transparent 70%),
 radial-gradient(38% 40% at 82% 18%,rgba(165,130,255,.7),transparent 70%),
 radial-gradient(45% 40% at 72% 85%,rgba(255,205,150,.75),transparent 70%),
 radial-gradient(35% 35% at 14% 82%,rgba(130,225,255,.7),transparent 70%);
 animation:aurora 16s ease-in-out infinite alternate;will-change:transform}
#bg::after{content:"";position:absolute;inset:0;background:
 radial-gradient(120% 60% at 50% -10%,rgba(255,255,255,.65),transparent 60%),
 radial-gradient(90% 50% at 50% 115%,rgba(255,255,255,.45),transparent 65%)}
@keyframes aurora{0%{transform:translate(0,0) rotate(0) scale(1)}50%{transform:translate(5%,-4%) rotate(8deg) scale(1.12)}100%{transform:translate(-4%,4%) rotate(-8deg) scale(1.2)}}
#bg .orb{position:absolute;bottom:-120px;border-radius:50%;z-index:1;
 background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(255,255,255,.25) 55%,rgba(255,255,255,.05) 72%);
 box-shadow:0 0 22px rgba(255,255,255,.55);opacity:.8;animation:orbUp linear infinite}
@keyframes orbUp{to{transform:translate(var(--dx,30px),-120vh)}}
#bg .twk{position:absolute;z-index:1;color:#fff;text-shadow:0 0 8px #fff,0 0 16px #ffb3dc;animation:twinkle ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
#bg .shoot{position:absolute;z-index:1;top:8%;left:-10%;width:120px;height:3px;border-radius:3px;opacity:0;
 background:linear-gradient(90deg,transparent,#fff 80%,#ffd6ee);box-shadow:0 0 10px #fff;transform:rotate(25deg);animation:shoot 7s ease-in infinite}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(25deg)}4%{opacity:1}14%{opacity:0;transform:translate(120vw,55vh) rotate(25deg)}100%{opacity:0;transform:translate(120vw,55vh) rotate(25deg)}}
#bg span{z-index:1}
#home{background:transparent}
.blob{opacity:.5}
@media (prefers-reduced-motion:reduce){#bg::before,#bg .orb,#bg .twk,#bg .shoot{animation:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<main id="home" class="screen on">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
  <button class="round" id="musTop" aria-label="Music" style="right:76px">🎵</button>
  <button class="round" id="sndTop" aria-label="Sound">🔊</button>
  <div class="hwrap">
    <div class="hheart heart">💖</div>
    <h1 class="htitle">DAVIDAISHU<br>FOREVER ♾️</h1>
    <div class="hsub">EMOJI MATCH ADVENTURE</div>
    <nav class="menu">
      <button class="mi hot" id="mPlay"><span class="ic">💖</span><span class="tx">Play Game</span><span class="ar">→</span></button>
      <button class="mi" id="mNew"><span class="ic">✨</span><span class="tx">New Game</span><span class="ar">→</span></button>
      <button class="mi" id="mBestRow"><span class="ic">🏆</span><span class="tx">Best Score</span><span class="ar" id="mBest">0</span></button>
      <button class="mi" id="mHow"><span class="ic">❓</span><span class="tx">How to Play</span><span class="ar">→</span></button>
      <button class="mi" id="mMus"><span class="ic">🎵</span><span class="tx">Music: On</span><span class="ar">→</span></button>
      <button class="mi" id="mSnd"><span class="ic">🔊</span><span class="tx">Sound: On</span><span class="ar">→</span></button>
    </nav>
    <p class="foot">ONE DEVICE · TAP &amp; SWIPE · NO INTERNET REQUIRED</p>
  </div>
</main>

<main id="game" class="screen">
  <header style="text-align:center">
    <h1 class="small">💖 DAVIDAISHU FOREVER ♾️ 💖</h1>
    <div class="sub">⭐ Emoji Match Adventure ⭐</div>
  </header>
  <section id="hud" class="glass" aria-label="Game stats">
    <div class="stat"><small>LEVEL</small><b id="hLvl">1</b></div>
    <div class="stat"><small>SCORE</small><b id="hScore">0</b></div>
    <div class="stat"><small>GOAL</small><b id="hTarget">0/50</b></div>
    <div class="stat"><small>MOVES</small><b id="hMoves">25</b></div>
  </section>
  <div id="barwrap"><div id="bar"></div></div>
  <section id="card" class="glass">
    <div id="wrap">
      <div id="board"></div>
      <div id="fx"></div>
      <div id="combo"></div>
    </div>
  </section>
  <nav id="btns">
    <button class="btn alt" id="pauseBtn">⏸ PAUSE</button>
    <button class="btn" id="restartBtn">🔄 RESTART</button>
    <button class="btn alt" id="sndBtn">🔊 SOUND</button>
    <button class="btn" id="musBtn">🎵 MUSIC</button>
    <button class="btn" id="howBtn2">❓ HOW TO PLAY</button>
  </nav>
</main>

<div id="modal"><div id="mbox" class="glass"></div></div>
<div id="toast"></div>
<div id="pwBanner"></div>

<script>
(function(){
"use strict";
const POOL=["😍","😘","🤗","😜","🤣","🫂","🥳","🫡","😳","🧐","😇","🥰","🤩","🥲","🙃","😉","🤭","😁","😄","🤫","🥹","🤨","😎","😭","😱","😡","👿","🤡"];
const N=8,$=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={lvl:store.get("svg_level",1),best:store.get("svg_best",0),snd:store.get("svg_snd",true),mus:store.get("svg_mus",true),score:0,total:0,moves:0,target:0,busy:false,paused:false,on:false,sel:null,types:[]};
let grid=[],uid=0;
const boardEl=$("#board"),fx=$("#fx");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- background music (WebAudio first, <audio> fallback) ---------- */
let tapped=false,musicBuf=null,musicLoading=null,musicSrc=null,musicGain=null,musicEl=null,musicOn=false,musicFailed=false;
function getAC(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();return AC}
function loadMusic(){
  if(musicBuf)return Promise.resolve(musicBuf);
  if(musicLoading)return musicLoading;
  musicLoading=new Promise((res,rej)=>{
    try{
      const bin=atob(window.BGM_SRC.split(",")[1]),u8=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      const ctx=getAC(),ab=u8.buffer;
      const p=ctx.decodeAudioData(ab,b=>{musicBuf=b;res(b)},e=>rej(e||new Error("decode failed")));
      if(p&&p.then)p.then(b=>{musicBuf=b;res(b)},rej);
    }catch(e){rej(e)}
  });
  musicLoading.catch(()=>{musicLoading=null});
  return musicLoading;
}
function stopMusic(){
  musicOn=false;
  try{if(musicSrc){musicSrc.onended=null;musicSrc.stop();musicSrc.disconnect()}}catch(e){}
  musicSrc=null;
  try{if(musicEl)musicEl.pause()}catch(e){}
}
function startMusic(){
  if(!tapped||musicFailed||musicSrc||(musicEl&&!musicEl.paused))return;
  musicOn=true;
  let ctx;try{ctx=getAC()}catch(e){}
  const ready=ctx?(ctx.state==="running"?Promise.resolve():ctx.resume()):Promise.reject(new Error("no AudioContext"));
  Promise.all([ready,loadMusic()]).then(r=>{
    if(!musicOn||musicSrc)return;
    const buf=r[1];
    musicGain=musicGain||ctx.createGain();musicGain.gain.value=.5;musicGain.connect(ctx.destination);
    const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;src.connect(musicGain);src.start(0);musicSrc=src;
  }).catch(err=>{
    /* fallback: plain <audio> element */
    try{
      musicEl=musicEl||new Audio(window.BGM_SRC);musicEl.loop=true;musicEl.volume=.5;
      const p=musicEl.play();
      if(p&&p.catch)p.catch(e2=>{musicOn=false;musicFailed=true;toast("🎵 Music error: "+(e2&&e2.name||err&&err.name||"unknown"))});
    }catch(e3){musicOn=false;musicFailed=true;toast("🎵 Music error: "+(e3&&e3.name||"unknown"))}
  });
}
function musicSync(){
  if(S.mus&&!document.hidden)startMusic();else stopMusic();
}
/* real tap events unlock audio on phones; keep retrying until playing */
["pointerup","touchend","click","keydown"].forEach(e=>document.addEventListener(e,()=>{
  tapped=true;
  if(S.mus&&!document.hidden)startMusic();
},true));
document.addEventListener("visibilitychange",musicSync);

/* ---------- sound ---------- */
let AC;
function tone(f,d=.12,type="sine",delay=0,v=.14){
  if(!S.snd)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+delay;o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}
}
const sfx={
  swap(){tone(330,.08,"triangle");tone(440,.08,"triangle",.07)},
  match(c){for(let i=0;i<3;i++)tone(520*Math.pow(1.122,i*2+c),.14,"sine",i*.07)},
  combo(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,"triangle",i*.07))},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.25,"triangle",i*.12))},
  bad(){tone(160,.2,"sawtooth",0,.08)},
  boom(){tone(110,.4,"sawtooth",0,.2);tone(70,.45,"square",.05,.15)},
  fire(){[0,.05,.1,.15,.2].forEach(d=>tone(200+rand(300),.08,"square",d,.06));tone(330,.3,"sawtooth",0,.06)},
  ice(){[1568,1319,1047,1319,1760].forEach((f,i)=>tone(f,.15,"triangle",i*.06,.1))},
  wind(){for(let i=0;i<7;i++)tone(380+i*50,.14,"sine",i*.05,.06)},
  zap(){[1800,900,1500,600,1200].forEach((f,i)=>tone(f,.07,"sawtooth",i*.04,.09));tone(90,.3,"square",.1,.12)},
  spin(){for(let i=0;i<9;i++)tone(300+(i%3)*120+i*25,.1,"triangle",i*.04,.07)},
  meteor(){tone(900,.35,"sawtooth",0,.07);tone(60,.5,"square",.2,.18)},
  mag(){[200,260,330,420,520].forEach((f,i)=>tone(f,.12,"sine",i*.06,.1))},
  wave(){for(let i=0;i<10;i++)tone(250+Math.sin(i/1.5)*150+i*20,.16,"sine",i*.05,.08)},
  gem(){[1047,1319,1568,2093,1568,2637].forEach((f,i)=>tone(f,.15,"triangle",i*.06,.09))}
};

/* ---------- pieces ---------- */
const POW={b:"💣",f:"🔥",i:"🥶",l:"🍃",z:"⚡",o:"🌪️",m:"☄️",g:"🧲",d:"💎",a:"🌊",n:"☢️",k:"🕳️",u:"🎆",x:"✨",y:"👑"},POWH={b:270,f:25,i:200,l:130,z:55,o:260,m:15,g:340,d:185,a:195,n:20,k:280,u:50,x:300,y:45};
const PKEYS=["b","f","i","l","z","o","m","g","d","a"];
function powerPiece(p){p.t=-1;p.sp=PKEYS[rand(PKEYS.length)];paint(p)}
function paint(p){
  if(p.sp==="w")p.in.textContent="🌈";
  else if(p.fu){p.in.textContent=p.fe;p.in.style.setProperty("--h",300)}else if(POW[p.sp]){p.in.textContent=POW[p.sp];p.in.style.setProperty("--h",POWH[p.sp])}
  else{p.in.textContent=S.types[p.t];p.in.style.setProperty("--h",(p.t*360/S.types.length+335)%360)}
  if(p.sp)p.el.dataset.sp=p.sp;else delete p.el.dataset.sp;
}
function mk(t){
  const el=document.createElement("div"),i=document.createElement("div");
  el.className="tile";i.className="in";el.appendChild(i);
  const p={id:uid++,t,sp:null,el,in:i};paint(p);boardEl.appendChild(el);return p;
}
function setPos(p,r,c){p.el.style.transform="translate("+c*100+"%,"+r*100+"%)"}
const at=k=>grid[(k/N)|0][k%N];

function findRuns(){
  const runs=[];
  for(const dir of ["h","v"]){
    for(let a=0;a<N;a++){
      let b=0;
      while(b<N){
        const g=(x)=>dir==="h"?grid[a][x]:grid[x][a];
        const p=g(b);
        if(!p||p.t<0){b++;continue}
        let e=b+1;while(e<N&&g(e)&&g(e).t===p.t)e++;
        if(e-b>=3){const cells=[];for(let x=b;x<e;x++)cells.push(dir==="h"?a*N+x:x*N+a);runs.push({dir,cells,t:p.t})}
        b=e;
      }
    }
  }
  return runs;
}
function hasMove(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(grid[r][c].sp)return true;
    for(const [dr,dc] of [[0,1],[1,0]]){
      const r2=r+dr,c2=c+dc;if(r2>=N||c2>=N)continue;
      const a=grid[r][c];grid[r][c]=grid[r2][c2];grid[r2][c2]=a;
      const ok=findRuns().length>0;
      grid[r2][c2]=grid[r][c];grid[r][c]=a;
      if(ok)return true;
    }
  }
  return false;
}
function newBoard(){
  boardEl.innerHTML="";grid=[];const n=S.types.length;
  for(let r=0;r<N;r++){grid[r]=[];for(let c=0;c<N;c++){
    let t;do{t=rand(n)}while((c>1&&grid[r][c-1].t===t&&grid[r][c-2].t===t)||(r>1&&grid[r-1][c].t===t&&grid[r-2][c].t===t));
    const p=mk(t);setPos(p,r,c);p.in.style.animationDelay=(r+c)*25+"ms";grid[r][c]=p;
  }}
  powerPiece(grid[rand(N)][rand(N)]);
  if(!hasMove())newBoard();
}

/* ---------- effects ---------- */
function cellXY(k){const s=boardEl.clientWidth/N;return[(k%N+.5)*s,(((k/N)|0)+.5)*s]}
function burst(k,count=4,em=["💖","✨","⭐","💕","🌸"]){
  const [x,y]=cellXY(k);
  for(let i=0;i<count;i++){
    const d=document.createElement("span"),a=Math.random()*6.28,l=30+Math.random()*50;
    d.className="pt";d.textContent=em[rand(em.length)];d.style.left=x+"px";d.style.top=y+"px";
    d.style.setProperty("--dx",Math.cos(a)*l+"px");d.style.setProperty("--dy",Math.sin(a)*l+"px");
    fx.appendChild(d);setTimeout(()=>d.remove(),900);
  }
}
function scorePop(txt,k){
  const [x,y]=cellXY(k),d=document.createElement("div");
  d.className="sc";d.textContent=txt;d.style.left=x+"px";d.style.top=y+"px";fx.appendChild(d);setTimeout(()=>d.remove(),1000);
}
function comboText(t){const e=$("#combo");e.textContent=t;e.classList.remove("go");void e.offsetWidth;e.classList.add("go")}
function shake(){const w=$("#card");w.classList.remove("shake");void w.offsetWidth;w.classList.add("shake")}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1500)}
function hud(){
  $("#hLvl").textContent=S.lvl;$("#hScore").textContent=S.score;$("#hTarget").textContent=S.goalE+" "+S.done+"/"+S.goal;$("#hMoves").textContent=S.moves;
  $("#bar").style.width=Math.min(100,S.done/S.goal*100)+"%";
}

/* ---------- core logic ---------- */
function expand(set,kinds){
  const q=[...set],own={b:"boom",f:"burn",i:"ice",l:"wind",z:"zap",o:"spin",m:"meteor",g:"mag",d:"gem",a:"wave",n:"boom",k:"mag",u:"fw"};

const adj=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;
function cellAt(e){
  const rc=boardEl.getBoundingClientRect(),c=Math.floor((e.clientX-rc.left)/rc.width*N),r=Math.floor((e.clientY-rc.top)/rc.height*N);
  return(r>=0&&r<N&&c>=0&&c<N)?{r,c}:null;
}
let down=null;
boardEl.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(S.busy||S.paused||!S.on)return;
  const c=cellAt(e);if(!c)return;
  down={...c,x:e.clientX,y:e.clientY,done:false,was:!!(S.sel&&S.sel.r===c.r&&S.sel.c===c.c)};
  try{boardEl.setPointerCapture(e.pointerId)}catch(_){}
  if(S.sel&&adj(S.sel,c)){down.done=true;trySwap(S.sel,c)}
  else if(!down.was)select(c);
});
boardEl.addEventListener("pointermove",e=>{
  if(!down||down.done||S.busy||S.paused)return;
  const dx=e.clientX-down.x,dy=e.clientY-down.y,th=boardEl.clientWidth/N*.35;
  if(Math.max(Math.abs(dx),Math.abs(dy))<th)return;
  const t=Math.abs(dx)>Math.abs(dy)?{r:down.r,c:down.c+Math.sign(dx)}:{r:down.r+Math.sign(dy),c:down.c};
  down.done=true;
  if(t.r>=0&&t.r<N&&t.c>=0&&t.c<N)trySwap({r:down.r,c:down.c},t);
});
const up=()=>{if(down&&!down.done&&down.was)clearSel();down=null};
boardEl.addEventListener("pointerup",up);boardEl.addEventListener("pointercancel",up);
boardEl.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});

/* ---------- buttons ---------- */
function snd(){$("#sndBtn").textContent=S.snd?"🔊 SOUND":"🔇 SOUND";$("#musBtn").textContent=S.mus?"🎵 MUSIC":"🔕 MUSIC";updateHome();musicSync()}
function updateHome(){
  $("#mPlay .tx").textContent=S.lvl>1?"Play Game · Level "+S.lvl:"Play Game";
  $("#mBest").textContent=S.best;
  $("#mSnd .tx").textContent="Sound: "+(S.snd?"On":"Off");
  $("#mSnd .ic").textContent=S.snd?"🔊":"🔇";
  $("#sndTop").textContent=S.snd?"🔊":"🔇";
  $("#mMus .tx").textContent="Music: "+(S.mus?"On":"Off");
  $("#mMus .ic").textContent=S.mus?"🎵":"🔕";
  $("#musTop").textContent=S.mus?"🎵":"🔕";
}
$("#mPlay").onclick=()=>{tone(660,.1,"triangle");startGame(true)};
$("#mNew").onclick=()=>{S.lvl=1;store.set("svg_level",1);tone(660,.1,"triangle");startGame(true)};
$("#mHow").onclick=()=>showHow();
const togSnd=()=>{S.snd=!S.snd;store.set("svg_snd",S.snd);snd();tone(660,.1,"triangle")};
$("#mSnd").onclick=togSnd;$("#sndTop").onclick=togSnd;
const togMus=()=>{S.mus=!S.mus;store.set("svg_mus",S.mus);snd();tone(660,.1,"triangle")};
$("#mMus").onclick=togMus;$("#musTop").onclick=togMus;$("#musBtn").onclick=togMus;
$("#howBtn2").onclick=()=>{if(!S.on||S.paused)return showHow();S.paused=true;boardEl.classList.add("paused");showHow(()=>{S.paused=false;boardEl.classList.remove("paused")})};
$("#sndBtn").onclick=()=>{S.snd=!S.snd;store.set("svg_snd",S.snd);snd();tone(660,.1,"triangle")};
$("#restartBtn").onclick=()=>{if(S.busy)return;startGame(true)};
$("#pauseBtn").onclick=()=>{
  if(!S.on||S.paused)return;
  S.paused=true;boardEl.classList.add("paused");
  modal('<h2>⏸ Paused</h2><p>Take a sweet break 💕</p>',[["▶ CONTINUE",()=>{S.paused=false;boardEl.classList.remove("paused")}]]);
};

/* ---------- background ---------- */
(function(){
  const bg=$("#bg"),em=["💖","💕","🌸","🥰","💗","🦋"];
  for(let i=0;i<16;i++){
    const s=document.createElement("span");s.textContent=em[rand(em.length)];
    s.style.left=Math.random()*100+"%";s.style.fontSize=18+Math.random()*26+"px";
    s.style.animationDuration=10+Math.random()*12+"s";s.style.animationDelay=-Math.random()*20+"s";bg.appendChild(s);
  }
  for(let i=0;i<14;i++){
    const o=document.createElement("i");o.className="orb";const z=14+Math.random()*46;
    o.style.width=o.style.height=z+"px";o.style.left=Math.random()*100+"%";o.style.setProperty("--dx",(Math.random()*80-40)+"px");
    o.style.animationDuration=12+Math.random()*16+"s";o.style.animationDelay=-Math.random()*24+"s";bg.appendChild(o);
  }
  for(let i=0;i<26;i++){
    const t=document.createElement("b");t.className="twk";t.textContent=Math.random()<.5?"✦":"✧";
    t.style.left=Math.random()*100+"%";t.style.top=Math.random()*100+"%";t.style.fontSize=8+Math.random()*14+"px";
    t.style.animationDuration=2+Math.random()*3+"s";t.style.animationDelay=-Math.random()*4+"s";bg.appendChild(t);
  }
  const sh=document.createElement("i");sh.className="shoot";bg.appendChild(sh);
})();
(function(){
  const em=["💖","✨","⭐","💕","🌸","🥰","😍","😘","🤩","😇"],h=$("#home");
  for(let i=0;i<10;i++){
    const s=document.createElement("span");s.textContent=em[rand(em.length)];
    s.style.left=Math.random()*100+"%";s.style.fontSize=18+Math.random()*24+"px";
    s.style.animationDuration=10+Math.random()*12+"s";s.style.animationDelay=-Math.random()*20+"s";h.appendChild(s);
  }
})();
snd();goHome();
})();
</script>
